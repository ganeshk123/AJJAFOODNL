workflows:
  ios-release:
    name: Karenderia Customer iOS

    max_build_duration: 120

    environment:
      node: 20
      xcode: latest
      cocoapods: default

    scripts:
      - name: Install Quasar CLI
        script: |
          npm install -g @quasar/cli

      - name: Install dependencies
        script: |
          npm install

      - name: Install Capacitor iOS
        script: |
          npm install @capacitor/ios

      - name: Sync Capacitor
        script: |
          npx cap sync ios

      - name: Install CocoaPods
        script: |
          cd ios/App
          pod install
          cd ../..

      - name: Build Quasar
        script: |
          quasar build -m capacitor -T ios

      - name: Build iOS IPA
        script: |
          xcode-project build-ipa \
            --workspace ios/App/App.xcworkspace \
            --scheme App

   artifacts:
  - build/ios/ipa/*.ipa
  - /tmp/xcodebuild_logs/*.log